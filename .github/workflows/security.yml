name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --ci
