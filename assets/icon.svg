  <g fill="#FFFFFF">
    <rect x="280" y="232" width="128" height="560" rx="24" ry="24" />
    <rect x="616" y="232" width="128" height="560" rx="24" ry="24" />
    <rect x="280" y="446" width="464" height="116" rx="24" ry="24" />
  </g>
</svg>
